# Desenvolvimento local: Postgres proprio. O servico roda fora do compose
# (`npm run start:dev`). Sem broker: a comunicacao com o OS Service e HTTP
# (RFC-0008) — aponte OS_SERVICE_URL para o OS rodando localmente.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: oficina_billing }
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, timeout: 5s, retries: 10 }
volumes:
  pgdata:
