# Variaveis NAO sensiveis. Segredos: Secret `oficina-billing-service-app` (JWT_SECRET e MP_*)
# e `oficina-billing-service-db` (DATABASE_URL), ambos sincronizados pelo CD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-service-config
  labels:
    { app.kubernetes.io/name: oficina-billing-service, app.kubernetes.io/part-of: oficina-mecanica }
data:
  NODE_ENV: 'production'
  PORT: '3001'
  JWT_ISSUER: 'oficina-auth-lambda'
  DB_SSL: 'true'
  # Rate limiting e da borda (API Gateway, ADR-0005); atras do NLB o IP de origem e unico.
  THROTTLER_DISABLED: 'true'
  # OS Service pelo DNS interno do cluster (RFC-0008): callbacks POST /ordens-servico/{numero}/eventos.
  # Chamadas entre servicos nao passam pelo API Gateway.
  OS_SERVICE_URL: 'http://oficina-app:3000'
  # Retorno do checkout do Mercado Pago: {base}/sucesso, /falha e /pendente.
  MP_RETORNO_BASE_URL: 'https://exemplo.com/pagamento'
  MP_ORDER_EXPIRACAO: 'P1D'
  ORCAMENTO_VALIDADE_DIAS: '7'
  DD_TRACE_ENABLED: 'true'
  DD_SERVICE: 'oficina-billing-service'
  DD_ENV: 'producao'
